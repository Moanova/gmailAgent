[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmailagent"
version = "0.1.0"
description = "Agent personnel de traitement des messages Gmail"
requires-python = ">=3.11"
dependencies = [
    "mistralai>=3.5",
    "pydantic>=2",
    "httpx",
    "structlog",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = []
py-modules = ["env", "journalisation", "client", "config", "labels"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
exclude = '(?x)(^|[/\\])agent0\d[a-c]?\.py$'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
